# ~/.config/llmq/config.toml

[api]
# Any OpenAI-compatible endpoint. Either the base URL or the full path —
# /chat/completions is appended if missing.
#   OpenAI      https://api.openai.com/v1
#   Groq        https://api.groq.com/openai/v1
#   OpenRouter  https://openrouter.ai/api/v1
#   Together    https://api.together.xyz/v1
#   llama.cpp   http://localhost:8080/v1
#   Ollama      http://localhost:11434/v1
url = "https://openrouter.ai/api/v1"

# Pick ONE of the three forms below.
key = "sk-..."                       # literal
# key = "$OPENAI_API_KEY"            # read from the environment
# key_command = "pass show openai"   # read from stdout of a command

model = "google/gemini-2.5-flash-lite"
temperature = 0.2
max_tokens = 1024
timeout = 60

# Anything here is merged verbatim into the JSON request body. Use it for
# provider-specific knobs llmq has no field for. Keys llmq writes itself
# (model, messages, stream, temperature, max_tokens) are rejected at startup.
#
# Reasoning models are slow because they think before answering, and llmq
# discards `delta.reasoning` — so a thinking model looks like a hang. Turn it
# off. The spelling depends on the provider:
#   OpenRouter   reasoning = { enabled = false }
#   OpenAI       reasoning_effort = "minimal"      # gpt-5 family
#   vLLM/Qwen    chat_template_kwargs = { enable_thinking = false }
# Note `reasoning = { exclude = true }` only *hides* the reasoning — you still
# wait for it. `enabled = false` is the one that saves time.
#
# [api.extra]
# reasoning = { enabled = false }
# provider = { sort = "latency" }   # OpenRouter: pick the fastest upstream

[prompt]
system = """
You are a terminal assistant. Reply with shell commands only.
No prose, no explanation, no markdown fences.
One command per line. If several approaches exist, give each on its own line.
"""
# Send whatever is already typed at the prompt along with the question.
include_context = true

[ui]
width_pct = 80
height_pct = 60
title = " llmq "

[tmux]
# Inside tmux, render in a real floating popup instead of drawing over the pane.
enabled = true
width = "80%"
height = "60%"
